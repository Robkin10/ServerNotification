name: telegram-tracker

services:
  tracker:
    # CI publishes this image. IMAGE_TAG is set to an immutable commit tag by
    # the deployment workflow, so a restart cannot accidentally change code.
    image: "${DOCKER_IMAGE:-robkin/3xui-telegrambot}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    init: true
    env_file:
      - ${TRACKER_ENV_FILE:-./app/.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TRACKER_DATABASE_PATH: /data/tracker.db
    ports:
      # The dashboard is local-only by default. Set TRACKER_BIND_ADDRESS=0.0.0.0
      # in the shell when starting Compose if a reverse proxy is not being used.
      - "${TRACKER_BIND_ADDRESS:-127.0.0.1}:${TRACKER_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/healthz', r =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
