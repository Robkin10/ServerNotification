name: Test, publish, and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one production deployment may run at a time. A newer main commit waits
# instead of interrupting a deployment that may already be restarting the app.
concurrency:
  group: telegram-tracker-production
  cancel-in-progress: false

env:
  # Set the optional repository variable DOCKERHUB_IMAGE to override this.
  DOCKER_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'robkin/3xui-telegrambot' }}
  IMAGE_TAG: sha-${{ github.sha }}
  TRACKER_ENV_FILE: /opt/telegramapp/app/.env

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  build_and_push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu
    needs: build_and_push
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Pull immutable image and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts "$DEPLOY_USER@$DEPLOY_HOST" \
            "DOCKER_IMAGE='$DOCKER_IMAGE' IMAGE_TAG='$IMAGE_TAG' TRACKER_ENV_FILE='$TRACKER_ENV_FILE' bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/telegramapp
          docker compose pull tracker
          docker compose up -d --no-build --remove-orphans

          container_id="$(docker compose ps -q tracker)"
          test -n "$container_id"
          for attempt in {1..18}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = healthy ]; then
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              docker compose ps
              exit 1
            fi
            sleep 5
          done

          docker compose ps
          exit 1
          REMOTE
